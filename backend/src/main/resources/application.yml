spring:
  application:
    name: marketpulse
  # Predictions, paper trades, holdings, results dates from news and dashboard snapshots. Without DATABASE_URL a
  # local H2 database file is used (backend/data/, kept across restarts). Production: free Postgres on Neon.
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/marketpulse;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 3      # tiny app; keeps memory and free-tier connection limits low
      connection-timeout: 30000 # Neon's free tier may need a few seconds to resume

server:
  port: ${PORT:8080}   # Render injects PORT

management:
  endpoints:
    web:
      exposure:
        include: health

marketpulse:
  # Shared secret the external scheduler sends in the X-Job-Token header. Required - jobs are rejected without it.
  job-token: ${JOB_TOKEN:}

  # React dashboard API (/api/**). Separate secret from the job token; the API is off until it's set.
  dashboard:
    token: ${DASHBOARD_TOKEN:}
    allowed-origins: ${DASHBOARD_ORIGINS:http://localhost:5173}   # comma-separated, e.g. https://marketpulse-xyz.vercel.app

  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    triage-model: claude-haiku-5-5    # cheap, high-volume headline triage
    brief-model: claude-opus-5-5      # daily briefs and explanations (later phases)

  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${ALERT_EMAIL_FROM:MarketPulse <onboarding@resend.dev>}
    to: ${ALERT_EMAIL_TO:}

  news:
    lookback: 45m          # only news newer than this is considered; poll every 15 min (slack for late scheduler runs)
    impact-threshold: 7    # alert when Claude scores impact >= 7/10
    batch-size: 20         # headlines per Claude call
    feeds:
      - name: ET Markets
        url: https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms
      - name: ET Economy
        url: https://economictimes.indiatimes.com/news/economy/rssfeeds/1373380680.cms
      - name: Business Standard Markets
        url: https://www.business-standard.com/rss/markets-106.rss
      - name: LiveMint Markets
        url: https://www.livemint.com/rss/markets
      - name: LiveMint Economy
        url: https://www.livemint.com/rss/economy
      - name: CNBC World
        url: https://www.cnbc.com/id/100727362/device/rss/rss.html
      - name: CNBC Economy
        url: https://www.cnbc.com/id/20910258/device/rss/rss.html
      - name: BBC Business
        url: https://feeds.bbci.co.uk/news/business/rss.xml
    # Pre-filter: only headlines containing one of these words/phrases are sent to Claude.
    keywords:
      # Indian policy & macro
      - rbi
      - repo rate
      - monetary policy
      - sebi
      - budget
      - gst
      - inflation
      - cpi
      - wpi
      - gdp
      - iip
      - fiscal deficit
      - rupee
      - fii
      - fpi
      - dii
      - nifty
      - sensex
      - bank nifty
      # Global macro
      - fed
      - federal reserve
      - powell
      - rate cut
      - rate hike
      - interest rate
      - treasury yield
      - bond yield
      - dollar index
      - recession
      - stimulus
      - tariff
      - tariffs
      - trade war
      - sanctions
      - opec
      - crude
      - brent
      - oil prices
      - gold
      - nasdaq
      - s&p 500
      - dow jones
      - china
      # Geopolitics & shocks
      - war
      - missile
      - attack
      - ceasefire
      - conflict
      - election
      - crash
      - selloff
      - sell-off
      # Corporate
      - earnings
      - q1
      - q2
      - q3
      - q4
      - quarterly results
      - board meeting
      - results date
      - net profit
      - guidance
      - merger
      - acquisition
      - stake sale
      - block deal
      - buyback
      - downgrade
      - upgrade
      - ipo
      - order win
    # Your stocks - news mentioning them always goes to Claude.
    watchlist:
      - Reliance
      - HDFC Bank
      - ICICI Bank
      - Infosys
      - TCS
      - SBI
      - Tata Motors
      - Larsen
      - Bharti Airtel
      - ITC

  swing:
    index-symbol: ^NSEI   # Nifty 50 - market context and relative strength benchmark
    top-n: 6              # max bullish and max "avoid" stocks per market-cap section
    # Stocks to scan. Empty = the bundled NSE lists (resources/indices): Nifty 500, reported as
    # Large cap (Nifty 100) · Mid cap (Nifty Midcap 100) · Small cap (Nifty Smallcap 100) · other Nifty 500.
    # Or list your own symbols here, e.g. [RELIANCE, TCS, INFY] (reported as one unsegmented list).
    universe: []
    results-warning-days: 15   # warn when a setup has results inside your typical holding period

  events:
    # NSE trading holidays - no brief or EOD scan on these days. Update each year from nseindia.com.
    # (2027 list not published yet as of Nov 2026.)
    holidays: [2026-11-24, 2026-12-25]
    # Macro events. Fed decisions land around midnight IST, so India reacts the next morning.
    macro:
      - { date: 2026-12-04, title: "RBI monetary policy decision", impact: HIGH }
      - { date: 2026-12-09, title: "US Fed rate decision (announced ~00:30 IST on 10 Dec)", impact: HIGH }
      - { date: 2027-01-27, title: "US Fed rate decision (announced ~00:30 IST next day)", impact: HIGH }
      - { date: 2027-02-01, title: "Union Budget 2027-28", impact: HIGH }
      - { date: 2027-02-05, title: "RBI monetary policy decision", impact: HIGH }
      - { date: 2027-03-17, title: "US Fed rate decision (announced ~23:30 IST)", impact: HIGH }
      - { date: 2027-04-28, title: "US Fed rate decision (announced ~23:30 IST)", impact: HIGH }
      - { date: 2027-06-09, title: "US Fed rate decision (announced ~23:30 IST)", impact: HIGH }
      - { date: 2027-07-28, title: "US Fed rate decision (announced ~23:30 IST)", impact: HIGH }
      - { date: 2027-09-15, title: "US Fed rate decision (announced ~23:30 IST)", impact: HIGH }
      - { date: 2027-10-27, title: "US Fed rate decision (announced ~23:30 IST)", impact: HIGH }
    # Manual results dates (board meetings). Dates found in news headlines are added automatically.
    # Example: - { symbol: TCS, date: 2027-01-08 }
    results: []

  brief:
    max-headlines: 40   # most recent relevant overnight headlines given to Claude
    event-days: 3       # events from today to 3 days ahead
    cues:
      - { name: "S&P 500", symbol: "^GSPC" }
      - { name: "Nasdaq", symbol: "^IXIC" }
      - { name: "Dow Jones", symbol: "^DJI" }
      - { name: "Nikkei 225", symbol: "^N225" }
      - { name: "Hang Seng", symbol: "^HSI" }
      - { name: "Brent crude ($)", symbol: "BZ=F" }
      - { name: "Gold ($)", symbol: "GC=F" }
      - { name: "US Dollar Index", symbol: "DX-Y.NYB" }
      - { name: "USD/INR", symbol: "INR=X" }
      - { name: "US 10Y yield (%)", symbol: "^TNX" }
      - { name: "India VIX", symbol: "^INDIAVIX" }
      - { name: "Nifty 50 (prev close)", symbol: "^NSEI" }
      - { name: "Bank Nifty (prev close)", symbol: "^NSEBANK" }

  positional:
    top-n: 6                  # max stocks per market-cap section in the Sunday report
    results-warning-days: 14  # suggest waiting for results due within two weeks
    universe: []              # empty = same stocks as swing.universe

  btst:
    top-n: 3                  # max candidates per section; only STRONG setups (score 80+) qualify for overnight risk
    intraday-per-segment: 10  # best daily pre-scores per section that get 15-min bars (keeps 500 stocks to ~4 min)
    universe: []      # empty = same stocks as swing.universe
