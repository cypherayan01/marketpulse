# Render Blueprint: New -> Blueprint -> point at this repo.
services:
  - type: web
    name: marketpulse-backend
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: JOB_TOKEN
        generateValue: true
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: DATABASE_URL        # Neon JDBC URL, e.g. jdbc:postgresql://ep-xxx.aws.neon.tech/neondb?sslmode=require
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DASHBOARD_ORIGINS   # your Vercel URL, e.g. https://marketpulse-xyz.vercel.app
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
